name: eas-build

# Compilaciones y recorridos Maestro: fuera de cada PR porque tardan y usan cuota de EAS.
# Corren bajo demanda (Actions → eas-build → Run workflow) y al subir una etiqueta de versión (v1.2.3).
# Secretos: EXPO_TOKEN. Variables de EAS (eas env:create): EXPO_PUBLIC_API_URL por entorno.
# Los recorridos de e2e/ necesitan una API con datos de demo: la del entorno "preview" de EAS.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil de EAS"
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: "Enviar a TestFlight y a la prueba interna de Google Play"
        type: boolean
        default: false
  push:
    tags: ["v*"]

env:
  PROFILE: ${{ github.event_name == 'push' && 'production' || inputs.profile }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test -- --ci
      - name: Compilar iOS y Android
        run: eas build --platform all --profile "$PROFILE" --non-interactive --no-wait
      - name: Enviar a las tiendas
        if: ${{ github.event_name == 'push' || inputs.submit }}
        run: eas build --platform all --profile "$PROFILE" --non-interactive --auto-submit --no-wait

  maestro-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Compilar APK de pruebas
        run: eas build --platform android --profile e2e --local --non-interactive --output app-e2e.apk
      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Recorridos en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: adb install app-e2e.apk && maestro test e2e

  maestro-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Compilar app de simulador
        run: |
          eas build --platform ios --profile e2e --local --non-interactive --output app-e2e.tar.gz
          mkdir -p build && tar -xzf app-e2e.tar.gz -C build
      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Recorridos en el simulador
        run: |
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl install booted build/*.app
          # sin-red.yaml usa el modo avión, que Maestro solo controla en Android
          for flow in e2e/*.yaml; do
            [ "$flow" = "e2e/sin-red.yaml" ] && continue
            maestro test "$flow"
          done
