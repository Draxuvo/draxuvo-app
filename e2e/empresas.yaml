# Recorrido: multi@demo.demo es dueño de Volta y staff de Sazón; al cambiar cambian las acciones.
appId: com.draxuvo.app
---
- launchApp:
    clearState: true
- tapOn:
    id: login-email
- inputText: "multi@demo.demo"
- tapOn:
    id: login-password
- inputText: "Demo12345*"
- tapOn: "Entrar"
- assertVisible: "Nueva orden"

# Cambiar a Sazón (staff): ya no se puede crear
- tapOn: "Volta"
- tapOn: ".*Sazón.*"
- assertVisible: "Por hacer"
- assertNotVisible: "Nueva orden"

# Volver a Volta (dueño)
- tapOn: "Sazón"
- tapOn: ".*Volta.*"
- assertVisible: "Nueva orden"
