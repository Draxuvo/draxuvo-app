# Recorrido: filtrar el historial de tickets (Órdenes → Cobradas → Historial), buscar por folio y cambiar el idioma desde el perfil.
appId: com.draxuvo.app
---
- launchApp:
    clearState: true
- tapOn:
    id: login-email
- inputText: "staff@volta.demo"
- tapOn:
    id: login-password
- inputText: "Demo12345*"
- tapOn: "Entrar"
- tapOn: "Cobradas"
- tapOn: "Historial"
- tapOn: "Cobrado"
- tapOn:
    id: tickets-search
- inputText: "T-"
- hideKeyboard

- tapOn: "Perfil"
- assertVisible: "Cerrar sesión"
- tapOn: "English"
- assertVisible: "Sign out"
- tapOn: "Español"
- assertVisible: "Cerrar sesión"
